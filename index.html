<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Add Expense Form -->
    <section class="card">
      <h2>Add Expense</h2>
      <form id="expense-form">
        <div class="form-row">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">Select...</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Housing</option>
              <option>Entertainment</option>
              <option>Health</option>
              <option>Shopping</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required />
          </div>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="What did you spend on?" required />
        </div>
        <button type="submit" class="btn btn-primary">Add Expense</button>
      </form>
    </section>

    <!-- Dashboard -->
    <section class="card">
      <div class="dashboard-header">
        <h2>Expenses</h2>
        <div class="header-actions">
          <span id="total-display" class="total">Total: $0.00</span>
          <button id="export-btn" class="btn btn-export">Export CSV</button>
        </div>
      </div>

      <table id="expense-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Description</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expense-list">
          <tr id="empty-row">
            <td colspan="5" class="empty-message">No expenses yet. Add one above!</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
